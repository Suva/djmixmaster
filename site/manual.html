<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · DJ Mix Master manual</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../style.css">
  <script>
    // Shown in the app's Help window (src/app/renderer/help.ts), a page takes the app's look, light or dark,
    // and leaves out its header, whose links the window's toolbar replaces. Read before the page draws, so it
    // does not flash dark first. On the website there is no parent to ask, or one that may not be asked.
    try {
      const frame = parent !== window && parent.document.documentElement;
      if (frame && frame.dataset.help !== undefined) {
        document.documentElement.classList.add('in-app');
        document.documentElement.dataset.theme = frame.dataset.theme;
      }
    } catch {}
  </script>
</head>
<body class="manual-page">
  <div class="wrap">
    <header>
      <img src="../icon.png" alt="">
      <a class="name" href="{{SITE}}">DJ Mix Master</a>
      <span class="spacer"></span>
      <a href="index.html">Manual</a>
      <a href="{{SITE}}changes.html">What's new</a>
      <a href="{{SITE}}">Download</a>
      <a href="{{REPOSITORY_URL}}">Source on GitHub</a>
    </header>
    <div class="manual">
      <details class="manual-nav" open>
        <summary>Contents</summary>
        {{NAV}}
      </details>
      <script>
        // On a phone the contents start folded, so the page is the first thing seen.
        if (matchMedia('(max-width: 820px)').matches) document.querySelector('.manual-nav').open = false;
      </script>
      <main class="manual-text">
        {{CONTENT}}
        {{PAGER}}
      </main>
    </div>
    <footer>
      <p>Something wrong or missing in the manual? <a href="{{REPOSITORY_URL}}/issues">Say so on GitHub</a>.</p>
      <p>DJ Mix Master is free software under the <a href="{{REPOSITORY_URL}}/blob/main/LICENSE">GNU General Public License</a>, version 3 or later. It comes without any warranty. <a href="{{SITE}}privacy.html">Privacy</a></p>
    </footer>
  </div>
</body>
</html>
