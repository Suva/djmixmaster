<!doctype html>
<html lang="en" data-help>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>DJ Mix Master Manual</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    #help-bar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
    #help-bar button.icon { width: 32px; height: 28px; }
    #help-search { position: relative; flex: 1; max-width: 460px; margin-left: 8px; }
    #help-query { width: 100%; font: inherit; color: var(--text); background: var(--lane); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; user-select: text; }
    #help-query:focus { outline: 1px solid var(--accent); }
    #help-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 10; max-height: min(480px, 70vh); overflow-y: auto; margin: 0; padding: 4px; list-style: none; background: var(--menu); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px var(--shadow); }
    #help-results[hidden] { display: none; }
    #help-results li { padding: 6px 9px; border-radius: 5px; cursor: pointer; }
    #help-results li.on { background: var(--menu-item); }
    #help-results .where { color: var(--muted); font-size: 12px; }
    #help-results .heading { color: var(--text); font-weight: 600; }
    #help-results .snippet { margin-top: 2px; color: var(--muted); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    #help-results mark { background: var(--accent-strong); color: var(--text); border-radius: 2px; }
    #help-results .none { color: var(--muted); cursor: default; }
    #help-page { flex: 1; width: 100%; border: 0; background: var(--bg); }
  </style>
</head>
<body>
  <div id="help-bar">
    <button id="help-back" class="icon" aria-label="Back" disabled><svg class="line" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
    <button id="help-forward" class="icon" aria-label="Forward" disabled><svg class="line" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
    <button id="help-home" class="icon" title="The manual's first page, with its contents" aria-label="Home"><svg class="line" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 2.5l5.5 5M4 6.5v7h3v-4h2v4h3v-7"/></svg></button>
    <div id="help-search">
      <input id="help-query" type="search" placeholder="Search the manual" aria-label="Search the manual" autocomplete="off" spellcheck="false">
      <ul id="help-results" role="listbox" hidden></ul>
    </div>
  </div>
  <iframe id="help-page" aria-label="The manual"></iframe>
  <script src="help.js"></script>
</body>
</html>
