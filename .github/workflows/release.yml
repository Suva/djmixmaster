# Builds the installers for macOS, Windows and Linux and publishes them as a release when a version tag
# such as v0.2.0 is pushed. It can also be started by hand from the Actions
# tab, which builds the installers without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            ffmpeg: node_modules/ffmpeg-static/ffmpeg
            installer: release/*.dmg
          - name: Windows
            os: windows-latest
            ffmpeg: node_modules/ffmpeg-static/ffmpeg.exe
            installer: release/*.exe
          - name: Linux
            os: ubuntu-latest
            ffmpeg: node_modules/ffmpeg-static/ffmpeg
            installer: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # `npm version` keeps package.json and the tag in step. If a tag was made
      # some other way, the tag still decides what the installers are called.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          recorded="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$recorded" ]; then
            echo "::warning::package.json says $recorded but the tag is $tagged. Building as $tagged; use 'npm version' to release so the two agree."
          fi
          npm version --no-git-tag-version --allow-same-version "$tagged"

      - run: npm run typecheck

      # The tests need ffmpeg; use the copy that gets bundled into the app.
      # The tests that drive the window are left out here until they have
      # proved themselves on these machines (see the trial job in test.yml);
      # a release must not fail over a test that has never run where it runs.
      - run: npm test
        env:
          DJMASTER_FFMPEG: ${{ github.workspace }}/${{ matrix.ffmpeg }}
          DJMASTER_SKIP_WINDOW_TESTS: 1

      - run: npm run package -- --publish never

      # Nobody here runs Linux, so the AppImage is started once, on a short
      # recording, to see that it opens, finds its own ffmpeg and draws.
      - name: Start the AppImage
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          node_modules/ffmpeg-static/ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=60" -ac 2 "$RUNNER_TEMP/Smoke test.wav"
          chmod +x release/*.AppImage
          app=$(ls release/*.AppImage)
          output=$(APPIMAGE_EXTRACT_AND_RUN=1 DJMASTER_SHOT="$RUNNER_TEMP/window.png" DJMASTER_SHOT_DATA="$RUNNER_TEMP/data" \
            DJMASTER_SHOT_SCRIPT="document.getElementById('file-name').textContent" \
            timeout 180 xvfb-run -a "$app" "$RUNNER_TEMP/Smoke test.wav" 2>&1) || true
          echo "$output"
          echo "$output" | grep -q '\[script\] Smoke test.wav'

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      # A tag made on GitHub's "new release" page already has its release; one
      # pushed from a terminal does not. Either way the installers end up on it.
      - name: Put the installers on the release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
