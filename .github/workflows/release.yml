# Builds the installers for macOS, Windows and Linux and publishes them as a release when a version tag
# such as v0.2.0 is pushed, and the package for the Microsoft Store, which is
# kept with the run rather than published. It can also be started by hand from
# the Actions tab, which builds them all without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            ffmpeg: node_modules/ffmpeg-static/ffmpeg
            installer: release/*.dmg
          - name: Windows
            os: windows-latest
            ffmpeg: node_modules/ffmpeg-static/ffmpeg.exe
            installer: release/*.exe
          - name: Linux
            os: ubuntu-latest
            ffmpeg: node_modules/ffmpeg-static/ffmpeg
            installer: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # `npm version` keeps package.json and the tag in step. If a tag was made
      # some other way, the tag still decides what the installers are called.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          recorded="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$recorded" ]; then
            echo "::warning::package.json says $recorded but the tag is $tagged. Building as $tagged; use 'npm version' to release so the two agree."
          fi
          # --ignore-scripts: the changelog was dated when the release was made.
          npm version --no-git-tag-version --allow-same-version --ignore-scripts "$tagged"

      - run: npm run typecheck

      # The capture helper for recording (native/capture), packaged beside ffmpeg. Built here as a step of its
      # own: `npm run package` would go on without it, and the app would record two channels only.
      - name: Build the capture helper
        run: node scripts/build-capture.mjs

      # The tests need ffmpeg; use the copy that gets bundled into the app.
      # The tests that drive the window are left out here until they have
      # proved themselves on these machines (see the trial job in test.yml);
      # a release must not fail over a test that has never run where it runs.
      - run: npm test
        env:
          DJMASTER_FFMPEG: ${{ github.workspace }}/${{ matrix.ffmpeg }}
          DJMASTER_SKIP_WINDOW_TESTS: 1

      - run: npm run package -- --publish never

      # ffmpeg is under the GPL, and its licence has to travel with it. electron-builder only warns when a file
      # to bundle is missing (the Windows build went without it for a while), so this looks.
      - name: See that ffmpeg's licence is in the app
        shell: bash
        run: |
          found=$(find release -path '*bin/ffmpeg.LICENSE' | head -1)
          if [ -z "$found" ]; then echo "::error::ffmpeg's licence is not in the app"; exit 1; fi
          echo "Found $found"

      # The helper is in the app, and runs there: these machines have no sound card, so it may have nothing to
      # list, but it says so in JSON. A library it cannot find, or a program the system will not start, would not.
      - name: See that the capture helper is in the app, and runs
        shell: bash
        run: |
          found=$(find release -path '*bin/djm-capture' -o -path '*bin/djm-capture.exe' | grep -v '\.msix' | head -1)
          if [ -z "$found" ]; then echo "::error::The capture helper is not in the app"; exit 1; fi
          echo "Found $found"
          if [ "$RUNNER_OS" = macOS ]; then codesign --verify --verbose "$found"; fi
          said=$("$found" list 2>&1) || true
          echo "$said"
          echo "$said" | grep -qE '^\[|"error"'

      # Nobody here runs Linux, so the AppImage is started once, on a short
      # recording, to see that it opens, finds its own ffmpeg and draws.
      - name: Start the AppImage
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          node_modules/ffmpeg-static/ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=60" -ac 2 "$RUNNER_TEMP/Smoke test.wav"
          chmod +x release/*.AppImage
          app=$(ls release/*.AppImage)
          output=$(APPIMAGE_EXTRACT_AND_RUN=1 DJMASTER_SHOT="$RUNNER_TEMP/window.png" DJMASTER_SHOT_DATA="$RUNNER_TEMP/data" \
            DJMASTER_SHOT_SCRIPT="document.getElementById('file-name').textContent" \
            timeout 180 xvfb-run -a "$app" "$RUNNER_TEMP/Smoke test.wav" 2>&1) || true
          echo "$output"
          echo "$output" | grep -q '\[script\] Smoke test.wav'

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

      # The package for the Microsoft Store, which signs it itself. It is not
      # put on the release: it is uploaded to Partner Center by hand, from this
      # run's downloads. Its identity comes from Partner Center, kept as the
      # repository's variables STORE_IDENTITY_NAME and STORE_PUBLISHER (Settings
      # → Secrets and variables → Actions → Variables); until they are set, a
      # stand-in is used, which builds but would be refused by the Store.
      - name: Build the Microsoft Store package
        if: matrix.name == 'Windows'
        shell: bash
        run: |
          if [ -z "$STORE_IDENTITY_NAME" ] || [ -z "$STORE_PUBLISHER" ]; then
            echo "::notice::STORE_IDENTITY_NAME or STORE_PUBLISHER is not set: the Store package has a stand-in identity and cannot be submitted."
          fi
          npx electron-builder --win appx --publish never \
            -c.appx.identityName="${STORE_IDENTITY_NAME:-DJMixMaster.Placeholder}" \
            -c.appx.publisher="${STORE_PUBLISHER:-CN=Placeholder}"
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}

      - uses: actions/upload-artifact@v7
        if: matrix.name == 'Windows'
        with:
          name: microsoft-store-package
          path: release/*.msix
          if-no-files-found: error

  # Hands the Store package to Partner Center as a new submission, for version tags, once the Store is set up:
  # the app's Store ID as the variable STORE_PRODUCT_ID, and Partner Center's credentials for GitHub as the
  # secrets PARTNER_CENTER_TENANT_ID, PARTNER_CENTER_SELLER_ID, PARTNER_CENTER_CLIENT_ID and
  # PARTNER_CENTER_CLIENT_SECRET. The submission is left as a draft, to be looked at and submitted in Partner
  # Center, unless the variable STORE_SUBMIT is "true". Microsoft certifies it either way. A failure here does
  # not hold up the release: the package is still in the run's downloads, for uploading by hand.
  # The Store package to Partner Center (store.yml), which can also be run again by hand for this run's package.
  # A failure there leaves the release alone: it is a job of its own, and does not mark this run failed.
  store:
    name: Microsoft Store
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/store.yml
    with:
      run-id: ${{ github.run_id }}
    secrets: inherit

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The installers only: the Store package stays with the run.
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      # A tag made on GitHub's "new release" page already has its release; one
      # pushed from a terminal does not. Either way the installers end up on it.
      - name: Put the installers on the release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
