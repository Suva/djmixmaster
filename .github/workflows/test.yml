# Type-checks and runs the tests on every push to main and on pull requests.
# Releases run the same checks on macOS and Windows before building.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check and test
    runs-on: ubuntu-latest
    env:
      # The tests never open a window, so Electron itself is not needed here.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The tests need ffmpeg; use the copy that gets bundled into the app.
      # The tests that start the app are left to the trial job below: this
      # machine has no display for a window.
      - run: npm test
        env:
          DJMASTER_FFMPEG: ${{ github.workspace }}/node_modules/ffmpeg-static/ffmpeg
          DJMASTER_SKIP_WINDOW_TESTS: 1

  # A trial: the tests that start the real app, on the two systems it ships
  # for. They have only ever run on a developer's Mac, so a failure here does
  # not fail the workflow yet; look at this job's own result.
  window:
    name: Window tests on ${{ matrix.name }} (trial)
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            ffmpeg: node_modules/ffmpeg-static/ffmpeg
          - name: Windows
            os: windows-latest
            ffmpeg: node_modules/ffmpeg-static/ffmpeg.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/window.test.ts
        timeout-minutes: 10
        env:
          DJMASTER_FFMPEG: ${{ github.workspace }}/${{ matrix.ffmpeg }}
